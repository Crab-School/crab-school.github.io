
title: Crab School
baseurl: ""
url: "https://crab-school.github.io/.github"
remote_theme: "mmistakes/so-simple-theme"
description: "Collaborative learning and open-source excellence."

# So Simple theme settings
logo: "/assets/crab_school.png"
skin: "default"
locale: "en-US"
search: true
footer_links:
  - title: "GitHub"
    url: "https://github.com/Crab-School"
    icon: "fab fa-github"

# Add custom stylesheet
sass:
  style: compressed
  load_paths:
    - assets

# So Simple theme custom CSS
custom_css: /assets/custom.css

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      stylesheet: "/assets/main.scss"

# Social
social:
  type: "Organization"
  name: "Crab School"
  links:
    - "https://github.com/Crab-School"

# Plugins
plugins:
  - jekyll-remote-theme
